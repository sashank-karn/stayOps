[tool.pytest.ini_options]
# Run pytest from the repo root; this makes `shared`, `backend`, and `agents` importable.
pythonpath = [".", "backend"]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
include = ["agents*", "backend*", "shared*", "database*"]
exclude = ["docker*", "frontend*", "syllabus*", "demo_scripts*"]
